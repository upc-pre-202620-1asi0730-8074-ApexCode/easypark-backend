services:
  - type: web
    name: easypark-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_HTTP_PORTS
        value: "8080"
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: TokenSettings__Secret
        sync: false
      - key: Cors__AllowedOrigins
        sync: false
      - key: Database__Migrate
        value: "true"
      - key: SeedDemoData
        value: "false"
      - key: ExtendedFeatures__AlertWorkerEnabled
        value: "false"
